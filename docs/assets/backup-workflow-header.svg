<svg xmlns="http://www.w3.org/2000/svg"
     width="837" height="94"
     viewBox="0 0 837 94"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Backup workflow</title>
  <desc id="desc">
    Raspberry Pi backup icon, blue separator,
    heading and horizontal blue gradient line.
  </desc>

  <defs>
    <linearGradient id="icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#203b50"/>
      <stop offset="100%" stop-color="#101c28"/>
    </linearGradient>

    <linearGradient id="heading-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65bfff"/>
      <stop offset="50%" stop-color="#397da9"/>
      <stop offset="100%" stop-color="#397da9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded backup icon -->
  <rect x="5" y="7" width="78" height="78" rx="17"
        fill="url(#icon-bg)"
        stroke="#78caff" stroke-width="2"/>

  <!-- Raspberry Pi symbol -->
  <g fill="none" stroke="#e3f4ff"
     stroke-width="2.2" stroke-linecap="round"
     stroke-linejoin="round">

    <path d="M30 27 C23 20 17 23 18 30
             C19 35 25 36 30 33"/>
    <path d="M36 27 C43 20 49 23 48 30
             C47 35 41 36 36 33"/>

    <path d="M33 34
             C19 34 17 44 22 49
             C16 55 22 66 33 68
             C44 66 50 55 44 49
             C49 44 47 34 33 34Z"/>

    <circle cx="27" cy="44" r="3"/>
    <circle cx="39" cy="44" r="3"/>
    <circle cx="33" cy="53" r="3"/>
    <circle cx="26" cy="59" r="2.5"/>
    <circle cx="40" cy="59" r="2.5"/>
  </g>

  <!-- Storage cylinder -->
  <g stroke="#a7cfe7" stroke-width="1.5">
    <ellipse cx="61" cy="37" rx="11" ry="4"
             fill="#b6d9ed"/>
    <path d="M50 37 V59
             C50 65 72 65 72 59
             V37"
          fill="#456f8a"/>
    <path d="M50 48 C50 54 72 54 72 48"
          fill="none"/>
  </g>

  <!-- Backup synchronization arrow -->
  <path d="M52 68
           A12 12 0 0 1 73 69"
        fill="none" stroke="#f5a623"
        stroke-width="4" stroke-linecap="round"/>
  <path d="M73 63 L76 71 L67 70"
        fill="none" stroke="#f5a623"
        stroke-width="3" stroke-linejoin="round"/>

  <!-- Vertical separator -->
  <path d="M103 17 V77"
        stroke="#78caff" stroke-width="2"
        stroke-linecap="round"/>

  <!-- Heading -->
  <text x="121" y="57"
        fill="#e8f2fa"
        font-family="Arial, Helvetica, sans-serif"
        font-size="29"
        font-weight="700">
    Backup workflow
  </text>

  <!-- Blue gradient line -->
  <rect x="375" y="47" width="447" height="3"
        rx="1.5" fill="url(#heading-line)"/>

</svg>
